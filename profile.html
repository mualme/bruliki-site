<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile - Bruliki</title>

    <link rel="icon" type="image/jpeg" href="images/star.jpg">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/responsive.css">
</head>

<body>
    <header>
        <div class="logo">
            <a href="index.html">Bruliki</a>
            <button type="button" id="themeButton" class="theme-toggle"
                    aria-label="Switch to dark theme" title="Switch theme">
                <span id="themeIcon" aria-hidden="true">☾</span>
            </button>
        </div>

        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="catalog.html">Catalog</a></li>
                <li><a href="about.html">About Us</a></li>
                <li><a href="contact.html">Contact</a></li>
                <li><a href="register.html">Register</a></li>
                <li><a href="login.html">Log In</a></li>
                <li><a href="profile.html" aria-current="page">Profile</a></li>
            </ul>
        </nav>
    </header>

    <main class="py-5">
        <div class="container" style="max-width: 650px;">
            <section class="p-4 border rounded shadow-sm bg-white">
                <h1 class="text-center mb-2">My Profile</h1>
                <p class="text-center text-muted mb-4">
                    Welcome to your Bruliki account.
                </p>

                <div class="mb-3">
                    <strong>Name:</strong>
                    <span id="profileName"></span>
                </div>

                <div class="mb-3">
                    <strong>Email:</strong>
                    <span id="profileEmail"></span>
                </div>

                <div class="mb-3">
                    <strong>Phone:</strong>
                    <span id="profilePhone"></span>
                </div>

                <div class="mb-4">
                    <strong>Country:</strong>
                    <span id="profileCountry"></span>
                </div>

                <button type="button" id="logoutButton"
                        class="btn btn-outline-secondary w-100">
                    Log Out
                </button>
            </section>
        </div>
    </main>

    <footer class="text-center py-4 bg-light border-top">
        <p class="mb-0">2026 Bruliki Luxury Accessories.</p>
    </footer>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="js/team-interactions.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
