<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <title>Contact Us - Bruliki</title>

    <link rel="icon" type="star/jpg" href="star.jpg">
    
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/responsive.css">
</head>

<body>
    <header>
        <div class="logo">Bruliki</div>
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="catalog.html">Catalog</a></li>
                <li><a href="about.html">About Us</a></li>
                <li><a href="contact.html">Contact</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <h1>Get in Touch</h1>
        <p>Have questions or want to place an order? Fill out the form below.</p>

        <form action="#" method="POST">
            <div>
                <label for="username">Your Name:</label>
                <input type="text" id="username" name="username" required>
            </div>
            <div>
                <label for="email">Email Address:</label>
                <input type="email" id="email" name="email" required>
            </div>
            <div>
                <label for="comment">Your Message / Order Details:</label>
                <textarea id="comment" name="comment" required></textarea>
            </div>
            <p style="margin-top: 20px; text-align: center;">
                <button type="submit" class="btn">Send message</button>
            </p>
        </form>
    </main>

    <footer>
        <p>2026 Bruliki Luxury Accessories.</p>
    </footer>
</body>
</html>
